name: Lua config implementation check

on:
  push:
    branches:
      - lua-config-hot-reload

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: lua-config-hot-reload

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Generate lockfile and format Rust
        run: |
          cargo generate-lockfile
          cargo fmt --all

      - name: Commit generated lockfile and formatting
        run: |
          git add Cargo.lock src xtask
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update lockfile and Rust formatting'
            git push
          fi

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build release binary
        run: cargo build --release --package momarchy --locked
