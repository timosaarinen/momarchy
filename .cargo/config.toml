[alias]
home = "run --package xtask -- home"
provision = "run --package xtask -- provision"
deploy = "run --package xtask -- deploy"
screenshot = "run --package xtask -- screenshot"
session = "run --package xtask --bin session --"

# Deployment targets can be genuinely old x86-64 machines. Keep release builds
# on the generic x86-64 baseline; never inherit the development machine's AVX2.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64"]
