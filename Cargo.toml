[package]
name = "momarchy"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "A tiny appliance-like home UI for a non-technical Linux user"
publish = false

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "2"
